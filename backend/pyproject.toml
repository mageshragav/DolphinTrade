[project]
name = "backend"
version = "0.1.0"
description = "DolphinTrade Django backend"
requires-python = ">=3.11"

# Pure-python packages keep exact pins (==).
# Compiled packages (numpy, pandas, etc.) use floor pins (>=) so the
# resolver can pick a wheel that exists for the active Python version
# (e.g. Python 3.13 has no wheels for numpy==2.0.0 / pandas==2.2.2).
dependencies = [
    "alpha-vantage==2.3.1",
    "celery==5.4.0",
    "Django==4.2.14",
    "gspread==6.1.2",
    "matplotlib>=3.9.0",
    "mysql-connector-python==8.4.0",
    "mysqlclient>=2.2.4",
    "numpy>=2.0.0,<3.0.0",
    "oauth2client==4.1.3",
    "pandas>=2.2.2,<3.0.0",
    "pyTelegramBotAPI==4.20.0",
    "requests==2.32.3",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "SQLAlchemy>=2.0.31",
    "ta==0.11.0",
    "tradingview_ta==3.3.0",
    "websocket-client==1.8.0",
    "websockets>=12.0",
    "xgboost>=2.0.3",
    "gevent>=23.7.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "langgraph>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
# Put the backend root on sys.path before any test imports so the `dolphin`
# namespace package resolves to backend/dolphin regardless of collection order
# (otherwise app/config.py's own path insert can shadow it with the nested
# backend/dolphin/dolphin Django package and break dolphin.* imports).
pythonpath = ["."]
testpaths = ["tests"]
